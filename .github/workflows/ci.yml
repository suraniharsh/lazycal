name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      # Catches broken intra-doc links, which nothing else here would.
      - name: Check the docs build
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # A calendar is all date arithmetic, so the suite is run where the local
  # clock is awkward: either side of UTC, across the day boundary, and in the
  # half- and quarter-hour offsets that catch assumptions about whole hours.
  timezones:
    name: test in ${{ matrix.tz }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz:
          - UTC
          - Asia/Kolkata # +05:30
          - Pacific/Chatham # +12:45
          - Pacific/Kiritimati # +14:00, the first date on earth
          - Pacific/Midway # -11:00, the last
          - America/Los_Angeles # observes daylight saving
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
        env:
          TZ: ${{ matrix.tz }}

  msrv:
    name: build on MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Taken from Cargo.toml so the pin can't drift from the declared MSRV,
      # and so there's no version tag here for Dependabot to "upgrade".
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          echo "Declared MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
