[package]
name = "lazycal"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["harsh surani <harshsurani00@gmail.com>"]
description = "A fast terminal UI for Google Calendar, backed by an offline SQLite cache"
repository = "https://github.com/suraniharsh/lazycal"
homepage = "https://github.com/suraniharsh/lazycal"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["calendar", "google-calendar", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
google-calendar3 = "7.0.0"
percent-encoding = "2.3.2"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"
yup-oauth2 = "12.1.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
